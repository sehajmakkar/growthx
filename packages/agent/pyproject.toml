[project]
name = "growthx-agent"
version = "0.1.0"
description = "The GrowthX growth orchestrator — a Strands agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents[gemini]>=0.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growthx_agent"]
